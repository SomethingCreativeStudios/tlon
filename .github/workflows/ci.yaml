name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true
      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Validate OpenAPI
        run: go test ./api -run TestOpenAPIContract
      - name: Lint OpenAPI
        run: npx --yes @redocly/cli@2.47.0 lint api/openapi.yaml
      - name: Generated-code drift
        run: make check-generate
      - name: Static analysis
        run: go vet ./...
      - name: Unit tests
        run: go test -race -coverprofile=coverage.out ./...
      - name: Native build
        run: go build ./cmd/tlon

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true
      - name: Build PostGIS test image
        run: docker build -f docker/postgis/Dockerfile -t tlon-postgis:test .
      - name: Start database
        run: docker run -d --name tlon-postgis -e POSTGRES_DB=tlon -e POSTGRES_USER=tlon -e POSTGRES_PASSWORD=tlon -p 5432:5432 tlon-postgis:test
      - name: Wait for database
        run: for i in $(seq 1 60); do docker exec tlon-postgis pg_isready -U tlon -d tlon && exit 0; sleep 2; done; exit 1
      - name: PostgreSQL/PostGIS tests
        env:
          TLON_TEST_DATABASE_URL: postgres://tlon:tlon@localhost:5432/tlon?sslmode=disable
        run: go test -tags=integration -count=1 ./...

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          tags: tlon:ci

  compose-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Persistent Hronir-style cycle
        run: ./scripts/e2e-compose.sh
