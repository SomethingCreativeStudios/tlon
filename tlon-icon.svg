<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 90 96">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feFlood flood-color="#E8E0CE" flood-opacity="0.85" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g filter="url(#glow)">
    <g fill="#14161F">
      <rect x="12" y="26" width="9" height="36" rx="2.5"/>
      <rect x="26" y="23" width="9" height="39" rx="2.5"/>
      <rect x="40" y="27" width="9" height="35" rx="2.5"/>
      <rect x="68" y="25" width="9" height="37" rx="2.5"/>
      <rect x="10" y="66" width="69" height="4.5" rx="2.25"/>
    </g>
    <rect x="54" y="15" width="9" height="47" rx="2.5" fill="#C99549"/>
    <g fill="#E8E0CE">
      <rect x="12" y="32" width="9" height="2.5"/>
      <rect x="26" y="29" width="9" height="2.5"/>
      <rect x="40" y="33" width="9" height="2.5"/>
      <rect x="68" y="31" width="9" height="2.5"/>
      <rect x="54" y="21" width="9" height="2.5"/>
    </g>
  </g>
</svg>
