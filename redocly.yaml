extends:
  - recommended

# Public read operations intentionally have no security requirement, and the
# development server URL is deliberately localhost. Operation summaries and
# per-operation 4xx declarations are documentation style rules rather than
# contract correctness rules; all operations use the shared default Problem
# response for errors.
rules:
  info-license: off
  no-server-example.com: off
  operation-4xx-response: off
  operation-summary: off
  security-defined: off
